# Dev tasks for Zones. Run with `mise run <task>` (e.g. `mise run test`).

[env]
# notarytool keychain profile. The team's existing profile from Bear Thingy works
# here too; `notary:setup` stores it, `signing:check` verifies it.
NOTARY_PROFILE = "BearThingyNotary"

[tasks.build]
description = "Build the package"
run = "swift build"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.format]
description = "Format Swift sources in place"
run = "swift format format --configuration .swift-format --in-place --recursive Sources Tests App Package.swift"

[tasks.lint]
description = "Check formatting; fail on any finding"
run = "swift format lint --configuration .swift-format --strict --recursive Sources Tests App Package.swift"

[tasks.check]
description = "Lint then test — the pre-commit check"
depends = ["lint", "test"]

[tasks.xcodegen]
description = "Regenerate Zones.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.app-build]
description = "Build the macOS app (Debug) into build/dd"
depends = ["xcodegen"]
run = "xcodebuild -project Zones.xcodeproj -scheme Zones -configuration Debug -destination 'platform=macOS' -derivedDataPath build/dd build -quiet"

[tasks.run]
description = "Build the Debug app and launch it, replacing a running copy"
depends = ["app-build"]
run = """
pkill -x Zones 2>/dev/null || true
open build/dd/Build/Products/Debug/Zones.app
"""

[tasks."build:export"]
description = "Archive and export a Developer ID-signed Zones.app to build/export (internal; used by install)."
depends = ["xcodegen"]
run = """
rm -rf build/Zones.xcarchive build/export
xcodebuild archive \\
  -project Zones.xcodeproj -scheme Zones \\
  -configuration Release -destination 'generic/platform=macOS' \\
  -archivePath build/Zones.xcarchive
xcodebuild -exportArchive \\
  -archivePath build/Zones.xcarchive \\
  -exportPath build/export \\
  -exportOptionsPlist ExportOptions.plist
"""

[tasks.install]
description = "Build, Developer ID sign, and install Zones.app into /Applications."
depends = ["build:export"]
run = """
app="/Applications/Zones.app"
pkill -x Zones 2>/dev/null || true   # stale menu-bar copy keeps the old bundle
rm -rf "$app"
ditto build/export/Zones.app "$app"
echo "installed: $app"
codesign --verify --deep --strict "$app" && echo "signature valid"
"""

[tasks."notary:setup"]
description = "Store the App Store Connect API key as the notarytool keychain profile. Reads ASC_KEY_PATH, ASC_KEY_ID, ASC_ISSUER_ID from the env."
run = """
missing=
for v in ASC_KEY_PATH ASC_KEY_ID ASC_ISSUER_ID; do
  eval "val=\\${$v:-}"
  [ -n "$val" ] || missing="$missing $v"
done
if [ -n "$missing" ]; then
  echo "set these env vars first:$missing" >&2
  echo "get the values from App Store Connect -> Users and Access -> Integrations -> Keys." >&2
  exit 1
fi
if [ ! -f "$ASC_KEY_PATH" ]; then
  echo "key file not found: $ASC_KEY_PATH" >&2
  exit 1
fi
xcrun notarytool store-credentials "$NOTARY_PROFILE" \\
  --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
echo "stored notary profile: $NOTARY_PROFILE"
"""

[tasks."signing:check"]
description = "Verify the distribution chain is ready: Developer ID cert, notary profile, hardened runtime."
run = """
fail=0
if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
  echo "ok    Developer ID Application certificate present"
else
  echo "FAIL  Developer ID Application certificate missing — create it in Xcode: Settings -> Accounts -> Manage Certificates"
  fail=1
fi
if xcrun notarytool history --keychain-profile "$NOTARY_PROFILE" >/dev/null 2>&1; then
  echo "ok    notary profile '$NOTARY_PROFILE' resolves"
else
  echo "FAIL  notary profile '$NOTARY_PROFILE' not set or invalid — run 'mise run notary:setup'"
  fail=1
fi
if grep -q "ENABLE_HARDENED_RUNTIME: YES" project.yml; then
  echo "ok    hardened runtime enabled in project.yml"
else
  echo "FAIL  hardened runtime not enabled in project.yml"
  fail=1
fi
[ "$fail" -eq 0 ] && echo "signing chain ready." || echo "signing chain not ready — resolve the FAIL lines above."
exit $fail
"""

[tasks."dist-app"]
description = "Notarize and staple build/export/Zones.app (internal; used by archive)."
depends = ["build:export"]
run = """
ditto -c -k --keepParent build/export/Zones.app build/Zones.zip
xcrun notarytool submit build/Zones.zip --keychain-profile "$NOTARY_PROFILE" --wait
xcrun stapler staple build/export/Zones.app
xcrun stapler validate build/export/Zones.app
"""

[tasks.archive]
description = "Build a notarized, stapled drag-to-Applications DMG in dist/ for installing on another Mac."
depends = ["dist-app"]
run = """
ver=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" \\
      build/export/Zones.app/Contents/Info.plist)
dmg="dist/Zones-$ver.dmg"
stage="build/dmg"; rm -rf "$stage" "$dmg"; mkdir -p "$stage" dist

ditto build/export/Zones.app "$stage/Zones.app"
ln -s /Applications "$stage/Applications"

hdiutil create -volname "Zones" -srcfolder "$stage" -ov -format UDZO "$dmg"

codesign --sign "Developer ID Application" --timestamp "$dmg"
xcrun notarytool submit "$dmg" --keychain-profile "$NOTARY_PROFILE" --wait
xcrun stapler staple "$dmg"
xcrun stapler validate "$dmg"
echo "archive: $dmg"
"""

[tasks.release]
description = "Bump the version, build a notarized DMG, then commit, tag, push, and publish a GitHub release."
usage = 'arg "[version]" help="Release version, e.g. 1.2.0 (prompted for when omitted)"'
raw = true   # the version prompt and the publish confirmation read from the terminal
run = """
set -euo pipefail

current=$(sed -n 's/^ *MARKETING_VERSION: "\\(.*\\)"/\\1/p' project.yml)
build=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\\(.*\\)"/\\1/p' project.yml)

ver="${usage_version:-}"
if [ -z "$ver" ]; then
  printf "Release version (current %s): " "$current"
  read -r ver
fi
ver="${ver#v}"
tag="v$ver"

fail() { echo "release: $*" >&2; exit 1; }
echo "$ver" | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+$' || fail "version must look like 1.2.3, got '$ver'"
[ "$ver" != "$current" ] || fail "version $ver is already the current version"

# Preflight: everything that could stop the release is checked before the long build.
# `gh auth status` fails when any stored account is stale, so check real repo access.
gh repo view --json nameWithOwner >/dev/null 2>&1 || fail "gh cannot reach this repo (run 'gh auth login')"
[ "$(git branch --show-current)" = "main" ] || fail "release from main"
[ -z "$(git status --porcelain --untracked-files=no)" ] || fail "commit or stash tracked changes first"
git fetch --quiet --tags origin
[ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] || fail "main is not in sync with origin/main"
git rev-parse -q --verify "refs/tags/$tag" >/dev/null && fail "tag $tag already exists"
mise run signing:check

# Bump the version; undo it if anything fails before the release commit.
committed=0
restore() { [ "$committed" -eq 1 ] || git checkout -- project.yml Zones.xcodeproj 2>/dev/null || true; }
trap restore EXIT
next_build=$((build + 1))
sed -i '' "s/^\\( *MARKETING_VERSION: \\)\\".*\\"/\\1\\"$ver\\"/" project.yml
sed -i '' "s/^\\( *CURRENT_PROJECT_VERSION: \\)\\".*\\"/\\1\\"$next_build\\"/" project.yml

mise run archive
dmg="dist/Zones-$ver.dmg"
[ -f "$dmg" ] || fail "archive did not produce $dmg"
sum=$(shasum -a 256 "$dmg" | cut -d' ' -f1)

echo
echo "Ready to publish $tag (build $next_build)"
echo "  $dmg"
echo "  sha256 $sum"
printf "Commit, tag, push, and create the GitHub release? [y/N] "
read -r answer
[ "$answer" = "y" ] || [ "$answer" = "Y" ] || fail "stopped before publishing; the version bump was undone"

git add project.yml Zones.xcodeproj
git commit -m "Release $ver"
committed=1
git tag -a "$tag" -m "Zones $ver"
git push origin main "$tag"
gh release create "$tag" "$dmg" \\
  --title "Zones $ver" \\
  --generate-notes \\
  --notes "Notarized DMG. SHA-256: \\`$sum\\`"
gh release view "$tag" --json url --jq .url
"""


[tasks.clean]
description = "Remove build output (build/ and dist/)."
run = "rm -rf build dist"

[tools]
xcodegen = "latest"
